<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#601D49">
    <title>Ula-Ulu Тренування вимови</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500..800&family=Unbounded:wght@500..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <meta name="description" content="Тренуйте вимову складних поєднань приголосних: натисніть кнопку й промовте склад вголос.">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ula-Ulu">
    <meta property="og:title" content="Ula-Ulu · Тренування вимови">
    <meta property="og:description" content="Одна кнопка — один склад. Тренуйте вимову складних поєднань приголосних.">
    <meta property="og:locale" content="uk_UA">
    <meta property="og:url" content="https://nikitakissa.github.io/ula-ulu/">
    <!-- <meta property="og:image" content="https://example.com/preview.png"> -->
    <!-- <meta property="og:image:width" content="1200"> -->
    <!-- <meta property="og:image:height" content="630"> -->

    <!-- <meta name="twitter:card" content="summary_large_image"> -->
    <meta name="twitter:title" content="Ula-Ulu · Тренування вимови">
    <meta name="twitter:description" content="Одна кнопка — один склад. Тренуйте вимову складних поєднань приголосних.">
    <!-- <meta name="twitter:image" content="https://example.com/preview.png"> -->

    <meta name="author" content="Nikita Kissa">
</head>
<body>
    <form id="game-type-form" role="dialog" aria-modal="true" aria-label="Вибір типу гри">
        <div class="overlay-content">
            <div class="brand">
                <img class="brand-name" src="icons/icon.svg" alt="Ula-Ulu" />
                <span class="brand-tag">Тренування вимови</span>
            </div>

            <label for="game-type">Оберіть тип гри</label>
            <select id="game-type" name="game-type">
                <option value="all">Усі</option>
                <option value="mrl">Мрл(і)</option>
                <option value="bd">Бд(і)</option>
                <option value="mn">Мн(і)</option>
                <option value="sn">Сн(і)</option>
                <option value="kpt">Кпт(і)</option>
                <option value="shch">Шч(і)</option>
                <option value="mrktch">Мрктч(і)</option>
                <option value="zd">Зд(і)</option>
                <option value="zis">Зіс(і)</option>
                <option value="lv">Лв(і)</option>
            </select>

            <button type="submit">Обрати</button>
        </div>
    </form>

    <main id="game">
        <h1 class="visually-hidden">Ula-Ulu: тренування вимови</h1>

        <p id="game-type-label">Тип гри: <span id="game-type-screen">усі</span></p>

        <button id="spell-button" type="button">
            <span id="screen" aria-live="polite">Старт</span>
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
